server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: core-node
              order: 1
              uri: lb://core-node
              predicates:
                - Path=/cn/**

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
